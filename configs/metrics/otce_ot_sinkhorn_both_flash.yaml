# The following is equivalent to original OTCE
metric: otce_distance
kwargs:
    use_wasserstein: True
    use_otdd: False
    use_flash_sinkhorn: True
    device: cuda
    debias: False

    # Sinkhorn parameters forwarded to ot_distance
    # Regularisation: epsilon = blur^p; smaller = sharper transport but slower convergence
    blur: 0.05
    # Multiscale annealing ratio in (0, 1); higher = more accurate but slower
    scaling: 0.9
    # Cost exponent: p=2 gives squared-Euclidean cost
    p: 2
