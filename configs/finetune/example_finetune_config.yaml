# This is an example: below dataset configs must exist in configs/data/
train_data_config: train_dataset_cfg
val_data_config: val_dataset_cfg
test_data_config: test_dataset_cfg

# these are passed directly to:
# transformers.AutoModelForImageClassification.from_pretrained
model_args:
  pretrained_model_name_or_path: "facebook/dinov3-vitl16-pretrain-lvd1689m"
  device_map: auto

training_args:
  eval_strategy: "epoch"
  save_total_limit: 1
  dataloader_num_workers: 8
  dataloader_persistent_workers: true
  # num_train_epochs: 1
  per_device_train_batch_size: 128  # 128 -> 8 minutest train for 1 epoch, x minutes total
  per_device_eval_batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.01

sweep_args:
  n_trials: 40
  objective: eval_average_precision
  direction: maximize  # minimize or maximize
  params:
    learning_rate:
      type: float
      low: 0.00001   # 1e-5
      high: 0.01     # 1e-2
      log: true
    weight_decay:
      type: float
      low: 0.00001   # 1e-5
      high: 0.1      # 1e-1
      log: true
    num_train_epochs:
      type: categorical
      choices: [1, 2, 3]
