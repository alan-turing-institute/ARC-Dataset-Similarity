train_data_config: qe_train_medium
val_data_config: qe_val_medium
test_data_config: qe_test_medium

# these are passed directly to:
# transformers.AutoModelForImageClassification.from_pretrained
model_args:
  pretrained_model_name_or_path: "microsoft/resnet-50"
  device_map: auto

training_args:
  num_train_epochs: 10
  per_device_train_batch_size: 32
  learning_rate: 0.001
  metric_for_best_model: average_precision
  greater_is_better: true
  eval_strategy: epoch
