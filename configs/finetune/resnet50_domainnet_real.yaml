train_data_config: train_domainnet_real_1000
val_data_config: test_domainnet_real_1000

# these are passed directly to:
# transformers.AutoModelForImageClassification.from_pretrained
model_args:
  pretrained_model_name_or_path: "microsoft/resnet-50"
  device_map: auto

training_args:
  num_train_epochs: 10
  per_device_train_batch_size: 32
  learning_rate: 0.001
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  load_best_model_at_end: true
