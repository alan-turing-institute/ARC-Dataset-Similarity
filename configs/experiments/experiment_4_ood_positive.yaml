# Increases false negatives by dropping some `animal` subclasses from the positive
# training label, while the data store keeps the full superclass (so the model
# sees OOD positives it never learned as positive).
train_split: trainARC
val_split: valARC
test_split: testARC
data_store: coco_data_store

train_time: "02:00:00"
eval_time: "01:00:00"
metrics_time: "00:30:00"

dataset_name: COCO
dataset_kwargs:
  embedding: dinov3
  random_seed: 42
  positive_superclass: [[animal]]
  # control, cats/dogs, farm animals, safari, bird, bear, bird+bear
  drop_subclasses: [null, [cat], [dog], [cat, dog], [sheep, horse, cow], [zebra, giraffe, elephant], [bird], [bear], [bird, bear]]
  negative_superclass: [null, [vehicle], [food], [furniture], [sports], [kitchen], [electronic], [indoor], [appliance], [accessory], [outdoor]]


overwrite:
  positive_fraction: 0.5

finetune:
  model_args:
    pretrained_model_name_or_path: "facebook/dinov3-vitl16-pretrain-lvd1689m"
    device_map: auto

  training_args:
    eval_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1
    dataloader_num_workers: 8
    dataloader_persistent_workers: true
    num_train_epochs: 1
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 128

  sweep_args:
    sampler: RandomSampler
    sweep_seed: 42
    n_trials: 10
    objective: eval_average_precision
    direction: maximize  # minimize or maximize
    params:
      learning_rate:
        type: float
        low: 0.00001   # 1e-5
        high: 0.001     # 1e-3
        log: true
      weight_decay:
        type: float
        low: 0.00001   # 1e-5
        high: 0.001      # 1e-3
        log: true

# The following contains the metrics to be used in the experiment
metrics:
  # Unlabelled metrics
  - mmd
  - ot_exact
  - ot_sinkhorn

  # Labelled metrics
  - otdd_approx
  - otce_ot_sinkhorn_coupling
