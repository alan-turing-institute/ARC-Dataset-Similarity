# The following config implements our first proof of concept experiment for use with the
# metrics script and poc_experiment notebook.
datasets:
  - domainnet_real_1000
  - domainnet_clipart_1000
  - experiment_0_alpha_0.25
  - experiment_0_alpha_0.5
  - experiment_0_alpha_0.75
metrics:
  # Unlabelled metrics
  - mmd
  - ot_exact
  - ot_sinkhorn

  # Labelled metrics
  - otdd_approx
  - otdd_exact
  - otce_ot_sinkhorn_both
  - otce_ot_sinkhorn_coupling
  - otce_otdd_both
  - otce_otdd_coupling
