# This config implements the quick experiment comparing three example test sets against
# the data store, using three different metrics.
train_split: trainARC
val_split: valARC
test_split: testARC

data_store: coco_data_store

# The following used to generate combinations of datasets for the experiment
dataset_name: COCO
dataset_kwargs:
  embedding: dinov3
  positive_class:
  # total percent / total N | percent single image / N
  - person  # 54% / 23488 | 9% / 3679
  - car # 10% / 4509 | 0% / 207
  - book # 5% / 1975 | 0% /
  - cat # 3% / 1499 |
  - cake # 2% / 1033 |
  - hot dog # 1% / 463 |
  - parking meter # 1% / 245 |
  negative_superclass: [null, vehicle, food]
  max_objects_per_image: [null, 4]
  min_bbox_area_fraction: [null, 0.5]
  # min_bbox_area_fraction: [null, 0.01]
  # max_bbox_area_fraction: [null, 0.6]
  filter_class: [null, positive]
  positive_fraction: [null, 0.01, 0.05]

# The following contains a fine-tuning config for the experiments. The same sweep is always used
finetune:
  model_args:
    pretrained_model_name_or_path: "facebook/dinov3-vitl16-pretrain-lvd1689m"
    device_map: auto

  training_args:
    eval_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1
    load_best_model_at_end: true

  sweep_args:
    n_trials: 10
    objective: eval_average_precision
    direction: maximize  # minimize or maximize
    params:
      learning_rate:
        type: float
        low: 0.00001   # 1e-5
        high: 0.01     # 1e-2
        log: true
      per_device_train_batch_size:
        type: categorical
        choices: [16, 32, 64]
      weight_decay:
        type: float
        low: 0.00001   # 1e-5
        high: 0.1      # 1e-1
        log: true
      num_train_epochs:
        type: categorical
        choices: [5, 10, 20]

# The following contains the metrics to be used in the experiment
metrics:
  - mmd
  - ot_exact
  - ot_sinkhorn
